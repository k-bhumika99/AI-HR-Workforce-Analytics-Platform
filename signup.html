{% extends "public_base.html" %}
{% block title %}Sign Up — Workforce Analytics{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">✨</div>
    <h1>Create your free account</h1>
    <p class="auth-subtitle">Start turning HR spreadsheets into insights in minutes.</p>

    <form method="post" action="{{ url_for('signup') }}" class="auth-form">
      <label for="name">🙋 Full Name</label>
      <input type="text" id="name" name="name" placeholder="Jane Doe" value="{{ name or '' }}" required autofocus>

      <label for="email">📧 Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" value="{{ email or '' }}" required>

      <label for="password">🔒 Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

      <label for="confirm_password">🔒 Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">

      <button type="submit" class="btn btn-primary btn-large auth-submit">🎉 Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in 🔑</a></p>
  </div>
</div>
{% endblock %}
