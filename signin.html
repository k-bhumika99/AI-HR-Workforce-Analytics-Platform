{% extends "public_base.html" %}
{% block title %}Sign In — Workforce Analytics{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🔑</div>
    <h1>Welcome back!</h1>
    <p class="auth-subtitle">Sign in to get back to your workforce dashboards.</p>

    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <label for="email">📧 Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" value="{{ email or '' }}" required autofocus>

      <label for="password">🔒 Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn btn-primary btn-large auth-submit">🚀 Sign In</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create a free account ✨</a></p>
  </div>
</div>
{% endblock %}
